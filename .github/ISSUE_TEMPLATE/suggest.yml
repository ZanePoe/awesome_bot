name: 推荐项目或论文
description: 补充主动式 Agent、扩展、组件或论文
title: '[推荐] '
body:
  - type: input
    id: url
    attributes:
      label: 原始来源链接
      description: GitHub canonical 仓库或论文原始页面
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: 资源类型
      options:
        - 完整助手
        - Harness / 插件 / 调度扩展
        - 电脑 / 浏览器操作组件
        - 研究代码 / 论文 / 基准
  - type: textarea
    id: evidence
    attributes:
      label: 主动机制与证据
      description: 如何在没有新用户指令时触发？如果只是组件，请写清楚作用边界。
    validations:
      required: true
  - type: input
    id: license
    attributes:
      label: 许可证与核验日期
      description: 无法确认时写待核验；论文无需填写代码许可
